# GitHub'ga yuklasangiz, APK ni bulutda oʻzi yigʻadi (Android Studio kerak emas).
# Natija: Actions > ishga tushirilgan jarayon > Artifacts > a7assistent-apk
name: Build Android APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: a7assistent-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
